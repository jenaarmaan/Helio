# SPDX-License-Identifier: MIT
services:
  # 1. Edge Gateway & Swarm Pipeline (Python Web Service)
  - type: web
    name: helio-edge-gateway-api
    env: python
    plan: free
    buildCommand: pip install -r gateway/requirements.txt -r swarm/requirements.txt
    startCommand: python gateway/edge_gateway.py
    envVars:
      - key: PORT
        value: "8080"
      - key: HELIO_CONTRACT_ADDRESS
        value: ""
      - key: HELIO_BESU_RPC_URL
        value: ""
      - key: GEMINI_API_KEY
        value: ""

  # 2. Vite React Dashboard (Static Web Site)
  - type: static
    name: helio-client-dashboard
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_GATEWAY_URL
        value: https://helio-edge-gateway-api.onrender.com
